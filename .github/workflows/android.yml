# Construit l'APK Android à chaque changement de l'app ; une étiquette v* publie une version.
name: Android

on:
  push:
    branches: [main]
    tags: ['v*']
    paths: ['public/**', 'mobile/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Copier l'application web dans le projet Android
        working-directory: mobile
        run: |
          npm ci
          npx cap sync android

      - name: Construire l'APK
        working-directory: mobile/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Nommer l'APK
        run: cp mobile/android/app/build/outputs/apk/debug/app-debug.apk tahiry.apk

      - uses: actions/upload-artifact@v4
        with:
          name: tahiry-apk
          path: tahiry.apk

      - name: Publier la version
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" tahiry.apk --title "Tahiry $GITHUB_REF_NAME" --notes "APK Android à installer sur le téléphone."
